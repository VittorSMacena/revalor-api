<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revalor • Demo do marketplace</title>
<style>
:root{
  --bg:#f6f4ee; --card:#fff; --ink:#1d2b24; --muted:#667068; --line:#e3dfd3;
  --green:#1f5e3b; --green-2:#2f7d52; --green-bg:#e6f1ea;
  --amber:#b8741a; --amber-bg:#fbefd9; --red:#b3392f; --red-bg:#fbe5e2; --blue:#2b5f8a; --blue-bg:#e3eef7;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--green);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.8;letter-spacing:0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:var(--green);font-weight:700}
.status{font-size:12px;display:flex;gap:10px;align-items:center;opacity:.95}
.dot{width:9px;height:9px;border-radius:50%;background:#e0b04a;display:inline-block}
.dot.ok{background:#7be0a1}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h2{margin:22px 0 10px;font-size:17px}
h3{margin:0 0 6px;font-size:15px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cards{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#faf8f2}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--green-bg);color:var(--green)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.grey{background:#eceae2;color:#59615b}
button.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-weight:600}
button.btn.ghost{background:#fff;color:var(--green)}
button.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
button.btn.amber{background:var(--amber);border-color:var(--amber)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cfcabb;border-radius:8px;background:#fff;color:var(--ink);width:100%}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
dialog{border:0;border-radius:14px;padding:20px;max-width:640px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,30,25,.5)}
.timeline{margin:8px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}
.timeline li{margin:0 0 8px 0;padding-left:12px;position:relative;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--green-2)}
.timeline li.alert::before{background:var(--red)}
.timeline li.done::before{background:var(--blue)}
.price{font-size:22px;font-weight:800;color:var(--green)}
.bar{height:10px;border-radius:99px;background:#e9e6db;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green-2);transition:width .6s}
.banner{padding:10px 12px;border-radius:10px;font-size:13.5px;margin:8px 0}
.banner.red{background:var(--red-bg);color:var(--red)}
.banner.amber{background:var(--amber-bg);color:var(--amber)}
.banner.green{background:var(--green-bg);color:var(--green)}
.split{display:grid;gap:14px;grid-template-columns:minmax(260px,320px) 1fr}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.list-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;margin-bottom:8px}
.list-item.sel{border-color:var(--green);box-shadow:0 0 0 2px var(--green-bg)}
svg text{font:12px system-ui}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90%;z-index:20}
#toast.err{background:var(--red)}
details summary{cursor:pointer;color:var(--green);font-weight:600;font-size:13.5px}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfcabb;border-radius:var(--radius)}
</style>
</head>
<body>
<header>
  <div class="logo">Revalor<small>matéria-prima, novo valor</small></div>
  <nav id="nav">
    <button data-persona="rafael">Rafael • Gerador</button>
    <button data-persona="beatriz">Beatriz • Compradora</button>
    <button data-persona="logistica">Logística ao vivo</button>
  </nav>
  <div class="status"><span id="live"><i class="dot"></i> conectando…</span></div>
</header>
<main id="app"></main>

<dialog id="dlgRegistro">
  <form method="dialog" id="formRegistro">
    <h3>Registrar matéria-prima excedente</h3>
    <p class="muted small">O lote entra em quarentena até a liberação pela qualidade.</p>
    <div class="row" style="margin-bottom:10px"><button type="button" class="btn ghost sm" id="btnExemplo">Preencher exemplo: bagaço de malte</button></div>
    <div class="fields">
      <div><label>Matéria-prima</label><input name="materiaPrima" required></div>
      <div><label>Categoria</label><input name="categoria" required></div>
      <div><label>Linha de origem</label><input name="linhaOrigem" required></div>
      <div><label>Setor</label><input name="setorOrigem"></div>
      <div><label>Lote de produção</label><input name="loteProducaoOrigem" required></div>
      <div><label>Quantidade líquida (kg)</label><input name="quantidadeLiquidaKg" type="number" step="0.1" min="0.1" required></div>
      <div><label>Motivo</label><input name="motivo" required></div>
      <div><label>Condição observada</label><input name="condicaoObservada" required></div>
      <div><label>Temperatura de coleta (°C)</label><input name="temperaturaColeta" type="number" step="0.1" required></div>
      <div><label>Acondicionamento</label><input name="acondicionamento" required></div>
      <div><label>Local de armazenamento</label><input name="localArmazenamento" required></div>
      <div><label>Coletado em</label><input name="coletadoEm" type="datetime-local" required></div>
      <div><label>Limite de uso informado</label><input name="limiteUsoInformado" type="datetime-local" required></div>
      <div><label>Responsável</label><input name="responsavel" required value="Rafael Medeiros"></div>
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button type="button" class="btn ghost" data-close="dlgRegistro">Cancelar</button>
      <button type="submit" class="btn">Registrar lote</button>
    </div>
  </form>
</dialog>

<dialog id="dlgOferta">
  <form method="dialog" id="formOferta">
    <h3 id="ofertaTitulo">Ofertar lote no marketplace</h3>
    <p class="muted small">Só lotes liberados pela qualidade. O preço anunciado é o teto: propostas nesse valor fecham a venda na hora.</p>
    <div class="fields">
      <div><label>Preço (R$/kg)</label><input name="precoKg" type="number" step="0.01" min="0.01" required></div>
      <div><label>Quantidade ofertada (kg)</label><input name="quantidadeKg" type="number" step="0.1" min="0.1" required></div>
      <div><label>Quantidade mínima por pedido (kg)</label><input name="quantidadeMinimaKg" type="number" step="0.1" min="0" value="0"></div>
      <div><label>Responsável</label><input name="responsavel" required value="Rafael Medeiros"></div>
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button type="button" class="btn ghost" data-close="dlgOferta">Cancelar</button>
      <button type="submit" class="btn">Publicar oferta</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg = n => Number(n).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' kg';
const brl = n => Number(n).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const hhmm = s => s ? s.slice(11, 16) : '–';
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const num = v => Number(String(v).replace(',', '.'));

const S = {
  persona: localStorage.getItem('persona') || 'rafael',
  compradores: [], comprador: 'COMP-01',
  dash: null, lotes: [], ofertas: [], negs: [], entregas: [], entregaSel: null,
  abertos: new Set(), live: false
};

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 204) return null;
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = data && (data.detail || data.message || data.error) || ('Erro ' + r.status);
    const campos = data && data.errors ? ' ' + data.errors.map(e => e.defaultMessage || e).join('; ') : '';
    throw new Error(msg + campos);
  }
  return data;
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', err ? 5000 : 2500);
}
const run = async (fn, ok) => { try { const r = await fn(); if (ok) toast(ok); await refresh(); return r; } catch (e) { toast(e.message, true); await refresh(); } };

// ---------- carga de dados ----------
async function carregar() {
  const [dash, lotes, ofertas, negs, entregas, compradores] = await Promise.all([
    api('GET', '/api/dashboard'), api('GET', '/api/lotes'), api('GET', '/api/mercado/ofertas'),
    api('GET', '/api/negociacoes'), api('GET', '/api/entregas'), api('GET', '/api/compradores')]);
  Object.assign(S, {dash, lotes, ofertas, negs, entregas, compradores});
  if (!S.entregas.find(e => e.codigo === S.entregaSel)) {
    const ativa = S.entregas.filter(e => e.status !== 'ENTREGUE').pop() || S.entregas[S.entregas.length - 1];
    S.entregaSel = ativa ? ativa.codigo : null;
  }
}
let pendente = null;
function refresh() { return carregar().then(render).catch(e => toast('Falha ao carregar: ' + e.message, true)); }
function agendarRefresh() { clearTimeout(pendente); pendente = setTimeout(refresh, 120); }

// ---------- tempo real (SSE) com fallback de polling ----------
function conectar() {
  const es = new EventSource('/api/eventos');
  const marca = ok => { S.live = ok; $('#live').innerHTML = `<i class="dot ${ok ? 'ok' : ''}"></i> ${ok ? 'ao vivo' : 'reconectando…'}`; };
  es.addEventListener('CONECTADO', () => marca(true));
  ['ESTOQUE_ATUALIZADO', 'OFERTA_ATUALIZADA', 'NEGOCIACAO_ATUALIZADA', 'ENTREGA_ATUALIZADA']
    .forEach(t => es.addEventListener(t, agendarRefresh));
  es.onerror = () => marca(false);
}
setInterval(() => { if (!S.live) refresh(); }, 5000);

// ---------- helpers de tela ----------
const chipSituacao = s => ({DISPONIVEL: '<span class="chip">Disponível</span>', RESERVADO: '<span class="chip blue">Reservado</span>', QUARENTENA: '<span class="chip amber">Quarentena</span>'}[s]);
const chipNeg = n => ({ABERTA: '<span class="chip amber">Aberta</span>', ACEITA: '<span class="chip">Aceita</span>', RECUSADA: '<span class="chip red">Recusada</span>', CANCELADA: '<span class="chip grey">Cancelada</span>'}[n.status]);
const chipEnt = s => ({AGUARDANDO_COLETA: '<span class="chip amber">Aguardando coleta</span>', EM_TRANSITO: '<span class="chip blue">Em trânsito</span>', CHEGANDO: '<span class="chip blue">Chegando</span>', ENTREGUE: '<span class="chip">Entregue</span>'}[s]);
const quem = (n, a) => a === 'COMPRADOR' ? n.comprador.nome.split(' ')[0] : 'Rafael';
function rodadaTxt(n, r) {
  const q = quem(n, r.autor), m = r.mensagem ? ` <span class="muted">“${esc(r.mensagem)}”</span>` : '';
  switch (r.tipo) {
    case 'PROPOSTA': return `<b>${q}</b> propôs ${kg(r.quantidadeKg)} a ${brl(r.precoKg)}/kg${m}`;
    case 'CONTRAPROPOSTA': return `<b>${q}</b> contrapropôs ${kg(r.quantidadeKg)} a ${brl(r.precoKg)}/kg${m}`;
    case 'ACEITE': return `<b>${q}</b> aceitou${m}`;
    case 'RECUSA': return `<b>${q}</b> recusou${m}`;
    default: return `<b>${q}</b> cancelou${m}`;
  }
}
function timeline(n) {
  return `<ul class="timeline">${n.rodadas.map(r => `<li class="${r.tipo === 'ACEITE' ? 'done' : ''}"><span class="muted">${hhmm(r.momento)}</span> ${rodadaTxt(n, r)}</li>`).join('')}</ul>`;
}
function acoesNeg(n, papel) {
  if (n.status === 'ACEITA') return `<div class="row"><span class="banner green" style="margin:0">Venda fechada • ${brl(n.valores.totalBruto)}</span><button class="btn ghost sm" data-act="verEntrega" data-id="${n.entregaCodigo}">Acompanhar entrega ${n.entregaCodigo}</button></div>`;
  if (n.status !== 'ABERTA') return '';
  const minha = n.vezDe === papel;
  const cancelar = papel === 'COMPRADOR' ? `<button class="btn warn sm" data-act="cancelar" data-id="${n.codigo}">Cancelar</button>` : '';
  if (!minha) return `<div class="row spread"><span class="muted small">Aguardando ${n.vezDe === 'VENDEDOR' ? 'o vendedor' : n.comprador.nome.split(' ')[0]}…</span>${cancelar}</div>`;
  const u = n.ultimaProposta, k = `neg-${n.codigo}-${papel}`;
  return `<div class="fields" style="margin:8px 0">
      <div><label>Quantidade (kg)</label><input data-keep id="${k}-q" type="number" step="0.1" value="${u.quantidadeKg}"></div>
      <div><label>Preço (R$/kg)</label><input data-keep id="${k}-p" type="number" step="0.01" value="${u.precoKg}"></div>
      <div><label>Mensagem</label><input data-keep id="${k}-m" placeholder="opcional"></div></div>
    <div class="row">
      <button class="btn sm" data-act="aceitar" data-id="${n.codigo}" data-papel="${papel}">Aceitar ${brl(u.precoKg)}/kg</button>
      <button class="btn amber sm" data-act="contrapropor" data-id="${n.codigo}" data-papel="${papel}" data-key="${k}">Contrapropor</button>
      ${papel === 'VENDEDOR' ? `<button class="btn warn sm" data-act="recusar" data-id="${n.codigo}">Recusar</button>` : cancelar}
    </div>`;
}
function cardNeg(n, papel) {
  const u = n.ultimaProposta;
  const valores = u && n.status !== 'CANCELADA' ? `<div class="small muted">Total ${brl(n.valores.totalBruto)}${papel === 'VENDEDOR' ? ` • comissão Revalor ${n.valores.percentualComissao}% (${brl(n.valores.comissaoRevalor)}) • você recebe ${brl(n.valores.liquidoVendedor)}` : ''}</div>` : '';
  return `<div class="card"><div class="row spread"><h3>${esc(n.codigo)} • ${esc(n.materiaPrima)} <span class="muted small">(${esc(n.loteCodigo)})</span></h3>${chipNeg(n)}</div>
    <div class="small muted">Comprador: ${esc(n.comprador.nome)} • ${esc(n.comprador.empresa)} • anunciado a ${brl(n.precoAnunciadoKg)}/kg</div>
    ${valores}${timeline(n)}${acoesNeg(n, papel)}</div>`;
}

// ---------- telas ----------
function telaRafael() {
  const d = S.dash, ofertados = new Set(S.ofertas.map(o => o.loteCodigo));
  const linhas = S.lotes.map(l => {
    let acoes = '';
    if (l.situacao === 'QUARENTENA') acoes = `<button class="btn sm" data-act="liberar" data-id="${l.codigo}">Liberar (qualidade)</button>`;
    else if (ofertados.has(l.codigo)) acoes = `<span class="chip blue">Ofertado</span> <button class="btn warn sm" data-act="retirar" data-id="${l.codigo}">Retirar</button>`;
    else if (l.situacao === 'DISPONIVEL') acoes = `<button class="btn amber sm" data-act="ofertar" data-id="${l.codigo}" data-kg="${l.disponivelKg}">Ofertar no marketplace</button>`;
    else acoes = `<span class="muted small">${esc(l.ordemReserva || '')}</span>`;
    const h = l.horasRestantes;
    return `<tr><td><b>${esc(l.codigo)}</b></td><td>${esc(l.materiaPrima)}</td><td>${kg(l.saldoKg)}<div class="small muted">${kg(l.disponivelKg)} livres</div></td>
      <td>${dm(l.limiteUso)} ${hhmm(l.limiteUso)}<div class="small muted">${h}h restantes</div></td><td>${chipSituacao(l.situacao)}</td><td>${acoes}</td></tr>`;
  }).join('');
  const negs = S.negs.filter(n => n.status === 'ABERTA' || n.status === 'ACEITA');
  return `
  <div class="row spread" style="margin-top:6px"><h2 style="margin:0">Estoque do gerador • Unidade Campinas</h2>
    <div class="row"><button class="btn ghost" data-act="preparar">⚡ Preparar cenário (bagaço de malte)</button><button class="btn" data-act="registrar">+ Registrar excedente</button></div></div>
  <div class="grid kpis" style="margin-top:12px">
    <div class="card kpi"><b>${kg(d.disponivelKg)}</b><span>Disponível (${d.lotesDisponiveis} lotes)</span></div>
    <div class="card kpi"><b>${kg(d.reservadoKg)}</b><span>Reservado (${d.lotesReservados} lotes)</span></div>
    <div class="card kpi"><b>${kg(d.quarentenaKg)}</b><span>Em quarentena (${d.lotesQuarentena} lotes)</span></div>
    <div class="card kpi"><b>${S.ofertas.length}</b><span>Ofertas no marketplace</span></div></div>
  <h2>Lotes</h2><div class="tablewrap"><table><thead><tr><th>Lote</th><th>Matéria-prima</th><th>Saldo</th><th>Limite de uso</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <h2>Propostas dos compradores</h2>
  ${negs.length ? `<div class="grid cards">${negs.map(n => cardNeg(n, 'VENDEDOR')).join('')}</div>` : '<div class="empty">Nenhuma proposta ainda. Quando um comprador propuser preço e quantidade, ela aparece aqui em tempo real.</div>'}`;
}

function cardOferta(o) {
  const k = `of-${o.loteCodigo}`, aberto = S.abertos.has(o.loteCodigo);
  const eventos = o.rastreabilidade.map(e => `<li><span class="muted">${dm(e.momento)} ${hhmm(e.momento)}</span> <b>${esc(e.titulo)}</b><div class="small muted">${esc(e.detalhe)}</div></li>`).join('');
  const aval = o.avaliacao.map(a => `<span class="chip ${a.conforme ? '' : 'red'}">${a.conforme ? '✓' : '✗'} ${esc(a.criterio)}</span>`).join(' ');
  const minha = S.negs.find(n => n.loteCodigo === o.loteCodigo && n.comprador.codigo === S.comprador && n.status === 'ABERTA');
  return `<div class="card">
    <div class="row spread"><h3>${esc(o.materiaPrima)} <span class="muted small">${esc(o.loteCodigo)}</span></h3><span class="chip ${o.horasRestantes <= 4 ? 'amber' : ''}">${o.horasRestantes}h de validade</span></div>
    <div class="price">${brl(o.precoKg)}<span class="muted small" style="font-weight:400"> /kg</span></div>
    <div class="small muted">${kg(o.quantidadeOfertadaKg)} ofertados${o.quantidadeMinimaKg > 0 ? ` • pedido mínimo ${kg(o.quantidadeMinimaKg)}` : ''} • ${esc(o.condicaoConservacao)}</div>
    <div class="small" style="margin:6px 0">${esc(o.vendedor)}<br><span class="muted">${esc(o.origem)}</span></div>
    <div class="small">Qualidade: ${esc(o.responsavelQualidade)} • laudo ${esc(o.laudo)} • processo ${esc(o.processoLiberado)}</div>
    <div style="margin:6px 0">${aval}</div>
    <details data-det="${o.loteCodigo}" ${aberto ? 'open' : ''}><summary>Rastreabilidade do lote</summary><ul class="timeline" style="margin-top:8px">${eventos}</ul></details>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    ${minha ? `<div class="banner amber">Você já tem a negociação ${minha.codigo} aberta para este lote.</div>` : `
    <div class="fields">
      <div><label>Quantidade (kg)</label><input data-keep id="${k}-q" type="number" step="0.1" min="0.1" value="${Math.min(o.quantidadeOfertadaKg, Math.max(o.quantidadeMinimaKg, 100))}"></div>
      <div><label>Seu preço (R$/kg)</label><input data-keep id="${k}-p" type="number" step="0.01" min="0.01" value="${(o.precoKg * 0.85).toFixed(2)}"></div>
      <div><label>Mensagem</label><input data-keep id="${k}-m" placeholder="opcional"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="propor" data-id="${o.loteCodigo}" data-key="${k}">Enviar proposta</button>
      <span class="small muted">No preço anunciado, a compra fecha na hora.</span></div>`}
  </div>`;
}
function telaBeatriz() {
  const c = S.compradores.find(x => x.codigo === S.comprador) || {};
  const minhas = S.negs.filter(n => n.comprador.codigo === S.comprador);
  const opts = S.compradores.map(x => `<option value="${x.codigo}" ${x.codigo === S.comprador ? 'selected' : ''}>${esc(x.nome)} • ${esc(x.cidade)}</option>`).join('');
  return `
  <div class="row spread" style="margin-top:6px"><h2 style="margin:0">Matéria-prima disponível • vitrine</h2>
    <div style="min-width:260px"><label>Comprando como</label><select id="selComprador">${opts}</select></div></div>
  <p class="muted small">${esc(c.empresa || '')} • entrega em ${esc(c.cidade || '')}. Lotes liberados pela qualidade, ordenados por validade (FEFO).</p>
  ${S.ofertas.length ? `<div class="grid cards">${S.ofertas.map(cardOferta).join('')}</div>` : '<div class="empty">Nenhum lote ofertado agora. Na aba do Rafael, libere um lote e ofereça no marketplace.</div>'}
  <h2>Minhas negociações</h2>
  ${minhas.length ? `<div class="grid cards">${minhas.map(n => cardNeg(n, 'COMPRADOR')).join('')}</div>` : '<div class="empty">Você ainda não fez propostas.</div>'}`;
}

function mapa(e) {
  const W = 560, H = 250, P = 46;
  const lats = [e.origem.latitude, e.destino.latitude], lngs = [e.origem.longitude, e.destino.longitude];
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const sx = (maxLng - minLng) || 1, sy = (maxLat - minLat) || 1, esc_ = Math.min((W - 2 * P) / sx, (H - 2 * P) / sy);
  const X = lng => P + (lng - minLng) * esc_ + ((W - 2 * P) - sx * esc_) / 2, Y = lat => H - P - (lat - minLat) * esc_ - ((H - 2 * P) - sy * esc_) / 2;
  const o = [X(e.origem.longitude), Y(e.origem.latitude)], d = [X(e.destino.longitude), Y(e.destino.latitude)], v = [X(e.posicao.longitude), Y(e.posicao.latitude)];
  const cor = e.alertaTemperatura ? 'var(--red)' : 'var(--green-2)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:#f1efe6;border-radius:10px">
    <line x1="${o[0]}" y1="${o[1]}" x2="${d[0]}" y2="${d[1]}" stroke="#b9b4a2" stroke-width="3" stroke-dasharray="7 6"/>
    <line x1="${o[0]}" y1="${o[1]}" x2="${v[0]}" y2="${v[1]}" stroke="${cor}" stroke-width="4"/>
    <rect x="${o[0] - 7}" y="${o[1] - 7}" width="14" height="14" fill="var(--green)" rx="3"/>
    <text x="${o[0] + 16}" y="${o[1] + 4}">${esc(e.origem.nome)}</text>
    <circle cx="${d[0]}" cy="${d[1]}" r="8" fill="var(--amber)"/>
    <text x="${d[0] - 16}" y="${d[1] + 4}" text-anchor="end">${esc(e.comprador.cidade)}</text>
    <circle cx="${v[0]}" cy="${v[1]}" r="11" fill="${cor}" opacity=".25"/><circle cx="${v[0]}" cy="${v[1]}" r="6.5" fill="${cor}" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
function telaLogistica() {
  if (!S.entregas.length) return `<h2>Logística ao vivo</h2><div class="empty">Ainda não há entregas. Feche uma negociação (Beatriz) para criar a primeira.</div>`;
  const lista = S.entregas.slice().reverse().map(e => `<div class="list-item ${e.codigo === S.entregaSel ? 'sel' : ''}" data-act="selEntrega" data-id="${e.codigo}">
      <div class="row spread"><b>${e.codigo}</b>${chipEnt(e.status)}</div><div class="small muted">${esc(e.materiaPrima)} • ${kg(e.quantidadeKg)} → ${esc(e.comprador.cidade)}</div></div>`).join('');
  const e = S.entregas.find(x => x.codigo === S.entregaSel);
  const fim = e.status === 'ENTREGUE', k = e.codigo;
  const temp = e.temperaturaC == null ? '–' : e.temperaturaC.toFixed(1) + ' °C';
  const ev = e.eventos.slice().reverse().map(x => `<li class="${x.alerta ? 'alert' : x.status === 'ENTREGUE' ? 'done' : ''}"><span class="muted">${hhmm(x.momento)}</span> <b>${esc(x.titulo)}</b><div class="small muted">${esc(x.detalhe)}${x.temperaturaC != null ? ' • ' + x.temperaturaC.toFixed(1) + ' °C' : ''}</div></li>`).join('');
  return `<h2>Logística ao vivo</h2><div class="split"><div>${lista}</div><div class="card">
    <div class="row spread"><h3>${k} • ${esc(e.materiaPrima)} • ${kg(e.quantidadeKg)}</h3>${chipEnt(e.status)}</div>
    <div class="small muted">${esc(e.negociacaoCodigo)} • lote ${esc(e.loteCodigo)} • ${esc(e.origem.nome)} → ${esc(e.destino.nome)} • ${e.distanciaTotalKm} km em linha reta</div>
    ${e.alertaTemperatura ? `<div class="banner red">⚠ Temperatura ${temp} acima do limite de ${e.temperaturaMaxC} °C. Risco de degradação da carga.</div>` : ''}
    ${e.riscoValidade ? `<div class="banner red">⚠ Chegada prevista às ${hhmm(e.eta)}, depois do limite de uso (${hhmm(e.limiteUso)}).</div>` : ''}
    <div style="margin:10px 0">${mapa(e)}</div>
    <div class="bar"><i style="width:${e.progresso}%"></i></div>
    <div class="row spread small muted" style="margin:4px 0 10px"><span>${e.progresso}% • faltam ${e.distanciaRestanteKm} km</span><span>Hora na viagem ${hhmm(e.atualizadaEm)}</span></div>
    <div class="grid kpis" style="margin-bottom:10px">
      <div class="card kpi"><b>${hhmm(e.eta)}</b><span>Chegada prevista</span></div>
      <div class="card kpi"><b>${hhmm(e.limiteUso)}</b><span>Limite de uso do lote</span></div>
      <div class="card kpi"><b style="color:${e.alertaTemperatura ? 'var(--red)' : 'inherit'}">${temp}</b><span>Temperatura (máx. ${e.temperaturaMaxC} °C)</span></div></div>
    <div class="row">
      ${e.status === 'AGUARDANDO_COLETA' ? `<button class="btn" data-act="coleta" data-id="${k}">Confirmar coleta</button>` : ''}
      ${!fim && e.status !== 'AGUARDANDO_COLETA' ? `<button class="btn ghost" data-act="falha" data-id="${k}">Simular falha de refrigeração</button>` : ''}
      ${!fim ? `<button class="btn ghost" data-act="avanco" data-id="${k}">Avançar 1 passo (15 min)</button>
        <button class="btn amber" data-act="sim" data-id="${k}" data-on="${!e.simulacaoAtiva}">${e.simulacaoAtiva ? '⏸ Pausar simulação' : '▶ Simulação automática'}</button>` : ''}
      ${e.status === 'CHEGANDO' ? `<button class="btn" data-act="confirmarEntrega" data-id="${k}">Confirmar recebimento</button>` : ''}
    </div>
    <h3 style="margin-top:14px">Eventos</h3><ul class="timeline">${ev}</ul></div></div>`;
}

function render() {
  const foco = document.activeElement, guarda = {};
  document.querySelectorAll('[data-keep]').forEach(i => guarda[i.id] = i.value);
  const idFoco = foco && foco.id, selIni = foco && foco.selectionStart;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.persona === S.persona));
  if (!S.dash) return;
  $('#app').innerHTML = {rafael: telaRafael, beatriz: telaBeatriz, logistica: telaLogistica}[S.persona]();
  document.querySelectorAll('[data-keep]').forEach(i => { if (guarda[i.id] !== undefined) i.value = guarda[i.id]; });
  if (idFoco && $('#' + idFoco)) { const el = $('#' + idFoco); el.focus(); try { el.setSelectionRange(selIni, selIni); } catch (e) {} }
}

// ---------- ações ----------
const val = id => $('#' + id).value;
const ACT = {
  registrar() { const f = $('#formRegistro'); f.reset(); f.responsavel.value = 'Rafael Medeiros'; $('#dlgRegistro').showModal(); },
  async preparar() {
    await run(async () => {
      const l = await api('POST', '/api/lotes', exemplo());
      const codigo = l.resumo.codigo;
      await api('POST', `/api/lotes/${codigo}/liberacao`, liberacaoBody(l));
      await api('POST', `/api/lotes/${codigo}/oferta`, {precoKg: 2.5, quantidadeKg: 600, quantidadeMinimaKg: 100, responsavel: 'Rafael Medeiros'});
    }, 'Cenário pronto: bagaço de malte ofertado a R$ 2,50/kg. Abra a aba da Beatriz.');
  },
  async liberar(id) {
    if (!confirm(`Liberar o lote ${id} como Qualidade (Marina Costa), com todos os itens conformes?`)) return;
    run(async () => { const d = await api('GET', '/api/lotes/' + id); await api('POST', `/api/lotes/${id}/liberacao`, liberacaoBody(d)); }, 'Lote liberado pela qualidade.');
  },
  ofertar(id, el) {
    const f = $('#formOferta'); f.reset(); f.dataset.lote = id; $('#ofertaTitulo').textContent = 'Ofertar ' + id + ' no marketplace';
    f.quantidadeKg.value = el.dataset.kg; f.responsavel.value = 'Rafael Medeiros'; $('#dlgOferta').showModal();
  },
  retirar(id) { run(() => api('DELETE', `/api/lotes/${id}/oferta`), 'Oferta retirada.'); },
  propor(id, el) {
    const k = el.dataset.key;
    run(() => api('POST', `/api/mercado/ofertas/${id}/negociacoes`, {compradorCodigo: S.comprador, quantidadeKg: num(val(k + '-q')), precoKg: num(val(k + '-p')), mensagem: val(k + '-m')}), 'Proposta enviada ao vendedor.');
  },
  contrapropor(id, el) {
    const k = el.dataset.key;
    run(() => api('POST', `/api/negociacoes/${id}/contraproposta`, {autor: el.dataset.papel, quantidadeKg: num(val(k + '-q')), precoKg: num(val(k + '-p')), mensagem: val(k + '-m')}), 'Contraproposta enviada.');
  },
  aceitar(id, el) { run(() => api('POST', `/api/negociacoes/${id}/aceite`, {autor: el.dataset.papel, mensagem: ''}), 'Negociação aceita: saldo reservado e entrega criada.'); },
  recusar(id) { run(() => api('POST', `/api/negociacoes/${id}/recusa`, {autor: 'VENDEDOR', mensagem: ''}), 'Proposta recusada.'); },
  cancelar(id) { run(() => api('POST', `/api/negociacoes/${id}/cancelamento`, {autor: 'COMPRADOR', mensagem: ''}), 'Negociação cancelada.'); },
  verEntrega(id) { S.entregaSel = id; setPersona('logistica'); },
  selEntrega(id) { S.entregaSel = id; render(); },
  coleta(id) { run(() => api('POST', `/api/entregas/${id}/coleta`, {}), 'Coleta confirmada.'); },
  avanco(id) { run(() => api('POST', `/api/entregas/${id}/avanco`)); },
  sim(id, el) { run(() => api('POST', `/api/entregas/${id}/simulacao`, {ativa: el.dataset.on === 'true'})); },
  confirmarEntrega(id) { run(() => api('POST', `/api/entregas/${id}/confirmacao`), 'Recebimento confirmado.'); },
  falha(id) {
    const e = S.entregas.find(x => x.codigo === id);
    run(() => api('POST', `/api/entregas/${id}/telemetria`, {latitude: e.posicao.latitude, longitude: e.posicao.longitude, temperaturaC: e.temperaturaMaxC + 5}), 'Telemetria enviada: temperatura acima do limite.');
  }
};
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-close]'); if (c) { $('#' + c.dataset.close).close(); return; }
  const el = ev.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === 'BUTTON' && el.disabled) return;
  ACT[el.dataset.act](el.dataset.id, el);
});
document.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.det) { d.open ? S.abertos.add(d.dataset.det) : S.abertos.delete(d.dataset.det); } }, true);
document.addEventListener('change', ev => { if (ev.target.id === 'selComprador') { S.comprador = ev.target.value; render(); } });
$('#nav').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setPersona(b.dataset.persona); });
function setPersona(p) { S.persona = p; try { localStorage.setItem('persona', p); } catch (e) {} render(); }

const exemplo = () => ({materiaPrima: 'Bagaço de malte', categoria: 'Grãos e cereais', linhaOrigem: 'Brassagem', setorOrigem: 'Filtração',
  loteProducaoOrigem: 'BRASS-0710-01', quantidadeLiquidaKg: 600, motivo: 'Subproduto da brassagem', condicaoObservada: 'Úmido, resfriado',
  temperaturaColeta: 4, acondicionamento: 'Big bag forrado', localArmazenamento: 'CF-01 • B-02', coletadoEm: '2026-10-07T08:30:00',
  limiteUsoInformado: '2026-10-07T14:30:00', responsavel: 'Rafael Medeiros'});
const CRITERIOS = ['Identidade e integridade', 'Histórico de temperatura', 'Plano de análises aplicável', 'Alergênicos e segregação'];
function liberacaoBody(d) {
  const proc = (d.processosAprovados || [])[0];
  if (!proc) throw new Error('Não há processo aprovado para ' + d.resumo.materiaPrima + '.');
  return {responsavel: 'Marina Costa', laudo: 'Q-' + d.resumo.codigo, processoCodigo: proc.codigo, limiteUsoValidado: d.resumo.limiteUso,
    itens: CRITERIOS.map(c => ({criterio: c, conforme: true, observacao: 'Conforme'}))};
}
$('#btnExemplo').onclick = () => { const f = $('#formRegistro'), x = exemplo(); for (const k in x) if (f[k]) f[k].value = x[k]; };
$('#formRegistro').addEventListener('submit', ev => {
  const f = ev.target, b = {};
  new FormData(f).forEach((v, k) => b[k] = v);
  b.quantidadeLiquidaKg = num(b.quantidadeLiquidaKg); b.temperaturaColeta = num(b.temperaturaColeta);
  b.coletadoEm = b.coletadoEm.length === 16 ? b.coletadoEm + ':00' : b.coletadoEm;
  b.limiteUsoInformado = b.limiteUsoInformado.length === 16 ? b.limiteUsoInformado + ':00' : b.limiteUsoInformado;
  run(() => api('POST', '/api/lotes', b), 'Lote registrado e em quarentena.');
});
$('#formOferta').addEventListener('submit', ev => {
  const f = ev.target, id = f.dataset.lote;
  run(() => api('POST', `/api/lotes/${id}/oferta`, {precoKg: num(f.precoKg.value), quantidadeKg: num(f.quantidadeKg.value), quantidadeMinimaKg: num(f.quantidadeMinimaKg.value || 0), responsavel: f.responsavel.value}), 'Lote ofertado no marketplace.');
});

refresh().then(conectar);
</script>
</body>
</html>
